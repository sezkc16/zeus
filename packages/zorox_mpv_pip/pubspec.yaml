name: zorox_mpv_pip
description: iOS Picture-in-Picture for the mpv player (ZoroX).
version: 0.0.1
repository: https://github.com/kcsuresh18/zorox

environment:
  sdk: ^3.13.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
flutter:
  plugin:
    implements: zorox_mpv_pip
    platforms:
      ios:
        package: ZoroxMpvPipPlugin
        pluginClass: ZoroxMpvPipPlugin
